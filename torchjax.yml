name: torchjax
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - setuptools
  - wheel

  # core numeric / compiled stack
  - numpy=1.26.4
  - scipy=1.15.3
  - pandas=2.1.4
  - matplotlib=3.10.7
  - seaborn=0.13.2
  - plotly=6.3.1
  - h5py=3.15.1
  - scikit-image=0.21.0
  - imageio=2.28.1
  - imagecodecs=2023.9.18
  - ffmpeg
  - numba=0.61.2
  - opencv=4.10.*
  - zarr=2.18.7
  - numcodecs=0.15.1

  # gui / napari side
  - napari=0.4.19
  - vispy=0.14.3
  - qtpy=2.4.3
  - qtconsole=5.7.0
  - superqt=0.7.7
  - magicgui=0.7.3

  # torch side
  - pytorch=2.5.1
  - torchvision=0.20.1
  - pytorch-cuda=12.1

  # other compiled things better left to conda
  - rdkit
  - cvxopt=1.3.2
  - dask=2026.1.1
  - distributed=2026.1.1
  - jupyterlab=4.4.10
  - ipykernel=6.31.0
  - ipywidgets=8.1.8

  - pip:
      # JAX stack: pinned to versions that fit jax==0.4.28
      - jax==0.4.28
      - jaxlib @ https://storage.googleapis.com/jax-releases/cuda12/jaxlib-0.4.28+cuda12.cudnn89-cp311-cp311-manylinux2014_x86_64.whl#sha256=40ed9648ece6278f1568285ae7dea610b88e7cfb0018ba4672d99dcdc08713fa
      - chex==0.1.87
      - equinox==0.11.4
      - flax==0.10.2
      - optax==0.2.4
      - orbax-checkpoint==0.5.16
      - evosax==0.1.6
      - jaxtyping==0.2.33
      - ml_dtypes==0.5.3
      - tensorstore==0.1.45
      - treescope==0.1.10

      # HF / training
      - accelerate==1.12.0
      - transformers==4.57.1
      - huggingface-hub==0.36.0
      - tokenizers==0.22.1
      - safetensors==0.6.2
      - wandb==0.22.3

      # config / utilities
      - omegaconf==2.3.0
      - dotmap==1.3.30
      - rich==13.9.4
      - typer==0.21.1
      - python-dotenv==1.2.1
      - build==1.4.0
      - pyproject_hooks==1.2.0
      - GitPython==3.1.45

      # media / tracking / zarr ecosystem
      - moviepy==1.0.3
      - imageio-ffmpeg==0.6.0
      - soundfile==0.13.1
      - ome-zarr==0.8.3
      - btrack==0.6.5
      - higra==0.6.13
      - trackpy==0.7
      - ultrack==0.5.0

      # web / api / storage
      - fastapi==0.125.0
      - uvicorn==0.40.0
      - httpx==0.28.1
      - aiohttp==3.13.3
      - aiobotocore==3.1.1
      - s3fs==0.6.0

      # db
      - SQLAlchemy==1.4.54
      - psycopg2-binary==2.9.11