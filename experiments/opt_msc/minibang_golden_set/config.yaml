base_config: experiments/opt_msc/optimization/config_longrun_check.yaml

rollout:
  # Explicit posthoc rollout layer. These values override base_config for
  # simulation/metric generation only; the optimization checkpoint stays intact.
  substrate:
    # Examples of safe rollout-only knobs to change:
    # rollout_steps: 300000
    # seed_n_patches: 4
    # seed_mode: random_patches
    # mutations: true
    # mutation_p: 0.05
    # mass_clip_eps: 0.0

  simulation:
    rollout_steps: 300000
    max_steps: 300000
    seed: 0
    img_size: 224
    fps: 250
    video_fps: 30
    codec: libx264
    macro_block_size: 1
    jit_microbatch: 64

  logging:
    snapshot_interval: 1000
    snapshots_per_file: 50
    save_A: true
    save_F: true
    save_rgb: false
    save_fp16: true
    compress: true
    save_lagrangian: true
    save_lagrangian_channels: true
    lagrangian_n_particles: 8192
    lagrangian_init_mode: mass
    lagrangian_flow_channel: -1
    lagrangian_flow_reduce: mass_weighted
    lagrangian_channel_mode: resample
    lagrangian_noise_model: rt_box
    lagrangian_diffusion_scale: 1.0

  metric:
    # Explicit posthoc DeltaH/MSC settings used for minibang metrics and plots.
    # Keep this block explicit so heatmaps are reproducible without relying on
    # inherited optimization defaults.
    metric_tau_mode: max_grid
    metric_tau_grid_steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]
    metric_window_size_steps: 20000
    metric_window_step_steps: 5000
    metric_tau_steps: 3000
    metric_range_start_steps: 150000
    metric_range_end_steps: 300000
    metric_window_size_frames: null
    metric_window_step_frames: null

    metric_m_samples: 48
    metric_m_min: 4
    metric_n_proj: 16
    metric_null_reps: 6
    metric_particle_samples: 64
    metric_dirs_seed: 123
    metric_periodic: null
    metric_domain_y: null
    metric_domain_x: null

    metric_preprocess_mode: clip
    metric_scales: null
    metric_scale_weights: null
    metric_alpha: 0.0
    metric_beta: 1.0
    metric_eps: 1.0e-12

minibang:
  checkpoint_dir: experiments/opt_msc/checkpoints/test_run_longrun_check
  output_root: experiments/opt_msc/checkpoints/test_run_longrun_check/minibang_golden_set
  n_trajectories: 80
  batch_size: 2

  selection_mode: loss_quantile_biased
  selection_keep_top_n: 5
  selection_loss_bias_gamma: 2.5
  selection_loss_jitter_frac: 0.15
  include_population: true
  include_best_traj: true
  include_final_best: true

  compute_metrics: true
  compute_delta_h: true
  compute_clusters: true
  metrics_strict: true
  metrics_seed: 12345
  detect_start_step: 150000
  detect_max_duration_steps: 30000

  # The optimization config uses trainable_grid; posthoc detection has no optimized
  # tau latent, so the runner evaluates all tau values and takes max_grid by default.
  minibang_metric_tau_mode: max_grid

  cluster_k: 8
  cluster_max_samples: 200000
  cluster_samples_per_snapshot: null
  cluster_min_mass: 1.0e-8
  cluster_standardize: true
  cluster_kmeans_iters: 40
  cluster_kmeans_restarts: 2
  cluster_change_lag_steps: 5000
