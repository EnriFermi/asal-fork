meta:
  save_dir: experiments/paper_check_boids/checkpoints/optimization/run_000

substrate:
  substrate: boids
  rollout_steps: 50000
  n_boids: 128
  n_nbrs: 16
  visual_range: 0.1
  speed: 0.5
  controller: network
  dt: 0.01
  bird_render_size: 0.015
  bird_render_sharpness: 40.0
  space_size: 1.0
  red_boid: true
  border: torus

simulation:
  time_sampling: video
  img_size: 224
  seed: 0
  output: experiments/opt_msc_boids/figures/best_simulation.mp4
  fps: 60
  codec: libx264
  macro_block_size: null
  batch_steps: 512
  jit_microbatch: 128
  max_steps: 50000
  mass_plot: experiments/opt_msc_boids/figures/best_mass.png
  log_mass_every: 1000
  traj_iter: null
  compute_oe: false
  oe_every: 100
  oe_plot: experiments/opt_msc_boids/figures/best_oe.png

logging:
  wandb_project: asal
