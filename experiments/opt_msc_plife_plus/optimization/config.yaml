meta:
  seed: 1
  save_dir: experiments/opt_msc_plife_plus/checkpoints/longrun_check
  resume: true

substrate:
  substrate: plife_plus
  rollout_steps: 200000
  n_particles: 800
  n_colors: 5
  dt: 0.05
  beta: 0.3
  mass: 0.1
  half_life: 0.04
  rmax: 0.1
  render_radius: 0.04
  sharpness: 30.0
  update_colors: true
  world_size: 1.0
  background_color: black

evaluation:
  sample_every_steps: 50
  log_clip_evolution: false

optimization:
  params_init: substrate_default
  bs: 1
  pop_batch: 8
  pop_size: 8
  n_iters: 50
  sigma: 0.2

logging:
  wandb_project: asal
  pca_every: 0

metric:
  metric_trajectory_source: state_x
  metric_tau_mode: trainable_grid
  metric_tau_grid_steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]
  metric_window_size_steps: 20000
  metric_window_step_steps: 5000
  metric_tau_steps: 3000
  metric_range_start_steps: 50000
  metric_range_end_steps: 200000
  metric_window_size_frames: null
  metric_window_step_frames: null
  metric_tau_frames: null
  metric_tau_grid_frames: null

  metric_m_samples: 48
  metric_m_min: 4
  metric_n_proj: 16
  metric_null_reps: 6
  metric_particle_samples: 64
  metric_dirs_seed: 123
  metric_periodic: null
  metric_domain_y: null
  metric_domain_x: null

  metric_preprocess_mode: clip
  metric_scales: null
  metric_scale_weights: null

  metric_alpha: 0.0
  metric_beta: 1.0
  metric_eps: 1.0e-12
