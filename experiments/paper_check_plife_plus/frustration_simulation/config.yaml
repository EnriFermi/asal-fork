meta:
  seed: 0
  save_dir: experiments/paper_check_plife_plus/checkpoints/frustration_simulation

source:
  checkpoint_dir: experiments/paper_check_plife_plus/checkpoints/optimization/run_000
  params_name: best
  params_path: null

substrate:
  substrate: plife_plus
  rollout_steps: 24000
  n_particles: 600
  n_colors: 6
  n_dims: 2
  x_dist_bins: 7
  beta: 0.3
  mass: 0.1
  dt: 0.02
  half_life: 0.04
  rmax: 0.1
  render_radius: 0.04
  sharpness: 30.0
  update_colors: true
  world_size: 1.0
  border: torus
  neighbor_mode: dense
  background_color: black

protocol:
  warmup_steps: 10000
  total_steps: 24000
  grid_split: 2
  perturbation_kind: cell_shuffle
  perturbation_grid_split: 2
  perturbation_strength: 1.0
  perturbation_jitter: 0.0
  perturbation_velocity_mode: keep

evaluation:
  clip_sample_every_steps: 250
  enable_clip: true
  enable_msc: true
  n_initial_states: 5
  foundation_model: clip
  clip_img_size: 224
  time_sampling: 8
  late_window_start_steps: 20000
  late_window_end_steps: 24000
  late_window_size_steps: null
  distance_metric: cosine_mean
  resume: true
  save_embeddings: true
  save_lagrangian_tracks: true

metric:
  sample_every_steps: 1
  metric_trajectory_source: state_x
  metric_unwrap_state_x: true
  metric_window_size_steps: 100
  metric_window_step_steps: 50
  metric_tau_steps: 25
  metric_range_start_steps: 0
  metric_range_end_steps: null
  metric_window_size_frames: null
  metric_window_step_frames: null
  metric_tau_frames: null
  metric_tau_mode: fixed
  metric_tau_grid_steps: null
  metric_tau_grid_frames: null
  metric_m_samples: 48
  metric_m_min: 4
  metric_n_proj: 16
  metric_null_reps: 6
  metric_particle_samples: 64
  metric_dirs_seed: 123
  metric_periodic: null
  metric_domain_y: null
  metric_domain_x: null
  metric_preprocess_mode: clip
  metric_scales: null
  metric_scale_weights: null
  metric_alpha: 1.0
  metric_delta_h_floor: 0.0
  metric_msc_floor: 0.01
  metric_msc_term: floor_reconstruction_error
  metric_msc_normalize_by_weight_sum: true
  metric_beta: 1.0
  metric_eps: 1.0e-3

logging:
  wandb_project: asal
  wandb_mode: online
