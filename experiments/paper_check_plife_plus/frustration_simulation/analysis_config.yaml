source:
  type: paper_check_frustration
  path: experiments/paper_check_plife_plus/checkpoints/frustration_simulation

output:
  dir: analysis/results/paper_check_plife_plus_history_distance_analysis

embeddings:
  enabled: true
  normalize: true
  synced_metrics:
    - cosine
    - euclidean
  cloud_metrics:
    - cosine
  cloud_method: chamfer
  primary_metric: embedding_cloud_chamfer_cosine

trajectories:
  enabled: true
  metric_tau_mode: fixed
  metric_tau_steps: 25
  metric_tau_grid_steps: null
  metric_tau_grid_frames: null
  metric_window_size_steps: 100
  metric_window_step_steps: 50
  metric_range_start_steps: 0
  metric_range_end_steps: null
  metric_m_samples: 48
  metric_m_min: 4
  metric_n_proj: 16
  metric_null_reps: 6
  metric_particle_samples: 64
  metric_dirs_seed: 123
  metric_periodic: true
  metric_domain_y: 1.0
  metric_domain_x: 1.0
  metric_preprocess_mode: clip
  metric_delta_h_floor: 0.0
  metric_msc_floor: 0.01
  metric_msc_term: floor_reconstruction_error
  metric_msc_normalize_by_weight_sum: true
  metric_alpha: 1.0
  metric_beta: 1.0
  metric_eps: 1.0e-3
  occupancy_bins: 64
  pairwise_map_metrics:
    - l2
    - mean_abs
  fixed_tau_distribution_steps: 25
  pairwise_distribution_metrics:
    - wasserstein
    - ks
    - energy
  primary_map_metric: delta_h_l2

statistics:
  permutation_max_exact: 200000
  permutation_samples: 20000
  permutation_seed: 0

progress:
  enabled: true
  show_inner: true
