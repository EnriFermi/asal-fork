meta:
  output_root: analysis/results/paper_suite
  conda_env: onerec
  wandb_mode: disabled

synthetic:
  families: [S0, S1, S3, S4, S5, S6, S7, S8]
  seeds: 1
  seed_base: 100
  n_particles: 48
  time_steps: 16384
  domain_size: 1.0
  tau_grid_steps: [4, 6, 8, 10]
  metric_window_size_steps: 16
  metric_window_step_steps: 8
  metric_range_start_steps: 0
  metric_m_samples: 8
  metric_m_min: 4
  metric_n_proj: 4
  metric_null_reps: 1
  metric_particle_samples: 32
  metric_dirs_seed: 123
  metric_seed: 12345
  # Delta-H preprocessing cutoff: values below this are zeroed before MSC.
  metric_delta_h_floor: 0.0
  # Synthetic MSC denominator floor in mean(g^2) + metric_msc_floor^2 + eps.
  metric_msc_floor: 0.01
  metric_eps: 1.0e-12
  # Paper-suite MSC scoring: averaged floor-aware reconstruction error.
  metric_msc_term: floor_reconstruction_error
  metric_msc_normalize_by_weight_sum: true
  render:
    enabled: true
    fps: 18
    size_px: 512
    max_frames: 512
    trail_steps: 16
    particle_radius_px: 3
    particle_stride: 1
    max_particles: null
    codec: mp4v
  visualization:
    heatmaps_enabled: true
    heatmap_cmap: coolwarm
    heatmap_max_runs: null
    # null means: visualize MSC_r at each run's selected tau. Set an integer
    # tau step to force a common tau across synthetic families.
    msc_r_tau_steps: null

datasets:
  flow_lenia:
    enabled: true
    required: true
    # Real legacy Flow-Lenia paper-check artifacts are split across these three
    # valid roots. Do not include experiments/paper_check/checkpoints3 or
    # experiments/paper_check/checkpoints4; those runs are known-bad.
    frustration_roots:
      - experiments/paper_check/checkpoints/frustration_simulation
      - experiments/paper_check/checkpoints_0/frustration_simulation
      - experiments/paper_check/checkpoints_reference/frustration_simulation
    c1:
      # Flow-Lenia C1 is read from the reusable A-run APF/lagrangian posthoc
      # metrics, not from the legacy late-window frustration artifacts.
      source: apf_lagrangian_split
      apf_root: experiments/paper_check_flow_lenia/checkpoints/arun_lagrangian_apf_500k
      require_random: true
      expected_window_start_steps: 50000
      expected_window_end_steps: 500000
      metric:
        metric_tau_mode: max_grid
        # APF is sampled every 1000 steps; with a 20000-step window and
        # metric_m_min=4, tau > 16000 is invalid.
        metric_tau_grid_steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 11000, 12000, 13000, 14000, 15000, 16000]
        metric_tau_steps: 3000
        metric_window_size_steps: 20000
        metric_window_step_steps: 5000
        metric_range_start_steps: 0
        metric_m_samples: 48
        metric_m_min: 4
        metric_n_proj: 16
        metric_null_reps: 6
        metric_particle_samples: 64
        metric_periodic: false
        metric_domain_y: 384.0
        metric_domain_x: 384.0
        metric_delta_h_floor: 0.0
        metric_msc_floor: 0.01
        metric_msc_term: floor_reconstruction_error
        metric_msc_normalize_by_weight_sum: true
    c5:
      metric:
        metric_tau_mode: max_grid
        metric_tau_grid_steps: [1000, 3000, 5000, 7000, 9000]
        metric_tau_steps: 3000
        fixed_tau_distribution_steps: 3000
        metric_window_size_steps: 20000
        metric_window_step_steps: 5000
        metric_range_start_steps: 0
        metric_m_samples: 48
        metric_m_min: 4
        metric_n_proj: 16
        metric_null_reps: 6
        metric_particle_samples: 64
        metric_periodic: false
        metric_domain_y: 384.0
        metric_domain_x: 384.0
        metric_delta_h_floor: 0.0
        metric_msc_floor: 0.01
        metric_msc_term: floor_reconstruction_error
        metric_msc_normalize_by_weight_sum: true

  plife_plus:
    enabled: true
    required: true
    frustration_root: experiments/paper_check_plife_plus/checkpoints/frustration_simulation
    analysis_config: experiments/paper_check_plife_plus/frustration_simulation/analysis_config.yaml
    c1:
      # C6 uses the same optimized-vs-random C1-style check on PLife++, but
      # from a reusable single-trajectory source separate from C5/C6.5.
      source: lagrangian_root
      lagrangian_root: experiments/paper_check_plife_plus/checkpoints/c1_lagrangian_500k
      require_random: true
      expected_trajectory_start_steps: 20000
      expected_trajectory_end_steps: 500000
      metric:
        metric_tau_mode: max_grid
        metric_tau_grid_steps: [250, 500, 750, 1000, 1250, 1500, 1750, 2000]
        metric_tau_steps: 500
        metric_window_size_steps: 2500
        metric_window_step_steps: 1250
        metric_range_start_steps: 0
        metric_range_end_steps: null
        metric_m_samples: 48
        metric_m_min: 4
        metric_n_proj: 16
        metric_null_reps: 6
        metric_particle_samples: 64
        metric_dirs_seed: 123
        metric_periodic: true
        metric_domain_y: 1.0
        metric_domain_x: 1.0
        metric_preprocess_mode: clip
        metric_delta_h_floor: 0.0
        metric_msc_floor: 0.01
        metric_msc_term: floor_reconstruction_error
        metric_msc_normalize_by_weight_sum: true
        metric_alpha: 0.0
        metric_beta: 1.0
        metric_eps: 1.0e-12
    c5:
      metric:
        metric_tau_mode: fixed
        metric_tau_grid_steps: null
        metric_tau_steps: 25
        fixed_tau_distribution_steps: 25
        metric_window_size_steps: 100
        metric_window_step_steps: 50
        metric_range_start_steps: 0
        metric_range_end_steps: null
        metric_m_samples: 48
        metric_m_min: 4
        metric_n_proj: 16
        metric_null_reps: 6
        metric_particle_samples: 64
        metric_dirs_seed: 123
        metric_periodic: true
        metric_domain_y: 1.0
        metric_domain_x: 1.0
        metric_preprocess_mode: clip
        metric_delta_h_floor: 0.0
        metric_msc_floor: 0.01
        metric_msc_term: floor_reconstruction_error
        metric_msc_normalize_by_weight_sum: true
        metric_alpha: 0.0
        metric_beta: 1.0
        metric_eps: 1.0e-12

  boids:
    enabled: true
    required: false
    frustration_root: experiments/paper_check_boids/checkpoints/frustration_simulation
    analysis_config: experiments/paper_check_boids/frustration_simulation/analysis_config.yaml
    c1:
      metric:
        metric_tau_mode: max_grid
        metric_tau_grid_steps: [100, 200, 400, 800, 1200, 1600, 2000, 3000, 4000]
        metric_tau_steps: 800
        metric_window_size_steps: 20000
        metric_window_step_steps: 5000
        metric_range_start_steps: 0
        metric_m_samples: 48
        metric_m_min: 4
        metric_n_proj: 16
        metric_null_reps: 6
        metric_particle_samples: 64
        metric_periodic: false
        metric_domain_y: 1.0
        metric_domain_x: 1.0
        metric_delta_h_floor: 0.0
        metric_msc_floor: 0.01
        metric_msc_term: floor_reconstruction_error
        metric_msc_normalize_by_weight_sum: true
    c5:
      metric:
        metric_tau_mode: max_grid
        metric_tau_grid_steps: [100, 200, 400, 800, 1200, 1600, 2000, 3000, 4000]
        metric_tau_steps: 800
        fixed_tau_distribution_steps: 800
        metric_window_size_steps: 20000
        metric_window_step_steps: 5000
        metric_range_start_steps: 0
        metric_m_samples: 48
        metric_m_min: 4
        metric_n_proj: 16
        metric_null_reps: 6
        metric_particle_samples: 64
        metric_delta_h_floor: 0.0
        metric_msc_floor: 0.01
        metric_msc_term: floor_reconstruction_error
        metric_msc_normalize_by_weight_sum: true

c2:
  required: true
  # Primary C2 source. The old minibang golden set is intentionally not used
  # as primary evidence because its 128x128 substrate is too noisy for the
  # transition-sensitivity claim.
  trajectory_root: experiments/paper_check_flow_lenia/checkpoints/arun_lagrangian_apf_500k
  legacy_minibang_root: experiments/flow_lenia_mspd/checkpoints/minibang_golden_set/run_longrun_check_v2
  flow_lenia_highres:
    enabled: false
    required: false
    rollout_config: experiments/paper_suite/flowlenia_arun_apf_500k.yaml
    output_root: experiments/paper_check_flow_lenia/checkpoints/arun_lagrangian_apf_500k
    # Valid paper-check Flow-Lenia optimized roots. checkpoints3/checkpoints4
    # are intentionally excluded.
    optimized_checkpoint_roots:
      - experiments/paper_check/checkpoints/optimization
      - experiments/paper_check/checkpoints_0/optimization
      - experiments/paper_check/checkpoints_reference/optimization
    # Keep run_XXX identity root-local. The three valid roots can contain the
    # same local run index, and those are distinct optimized checkpoints.
    dedupe_by_run_idx: false
    max_checkpoints: null
  branching:
    enabled: true
    required: false
    branch_root: analysis/results/paper_suite/c2_branching/branches
    max_trajectories: 2
    # Main C2 protocol: collapse Delta-H over admissible tau with the metric
    # preprocessing phi, then sample high/low quantile-rank windows independently.
    # Continuous Delta-H sampling remains available as selection_mode:
    # delta_h_quantile_sweep.
    selection_mode: tau_mean_ranked_high_low
    n_high: 5
    n_mid: 5
    n_low: 5
    selection_seed: 12345
    n_points_per_trajectory: 10
    point_quantile_min: 0.05
    point_quantile_max: 0.95
    # Legacy high/low fallback only.
    m_pairs: 2
    branches_per_time: 3
    # Set >1 to run C2 branch continuations through the batched resume runner.
    # The runner batches compatible arbitrary snapshots/params with the same
    # tensor shapes, horizon, snapshot cadence, and original RNG batch size.
    resume_batch_size: 4
    horizon_steps: 1000
    min_branch_step: 50000
    refractory_steps: 5000
    high_quantile: 0.8
    mid_quantile_low: 0.4
    mid_quantile_high: 0.6
    low_quantile: 0.2
    feature_max_apf_chunks: 4
    feature_max_snapshots_per_chunk: 8
    future_field_weights:
      A: 1.0
      P: 0.25
      F: 0.25
    # Branch divergence metric used by the metrics layer. Use apf for the
    # explicit APF multiscale L2 production metric, or override from CLI with
    # --branching-metric clip_chamfer for CLIP embedding cloud Chamfer distance.
    branching_metric: apf
    clip_foundation_model: clip
    clip_embedding_cache_dir: analysis/results/paper_suite/c2_branching/clip_embedding_cache
    future_field_scales: [1, 2, 4]
    future_max_frames: 32
    allow_debug_feature_fallback: false
    perturb:
      a_std: 0.01
      p_std: 0.01
      lagrangian_xy_std: 1.0

simulation:
  reuse_existing: true
  allow_optimization_rerun: false
  flow_lenia_arun_lagrangian_apf:
    enabled: true
    required: true
    rollout_config: experiments/paper_suite/flowlenia_arun_apf_500k.yaml
    output_root: experiments/paper_check_flow_lenia/checkpoints/arun_lagrangian_apf_500k
    rollout_steps: 500000
    n_trajectories_per_checkpoint: 1
    include_random_baselines: true
    num_random_baselines: 3
    # Match paper_check control-A seed_x = pair_seed_base + 2 * group_idx.
    run_seed_base: 400000
    run_seed_mode: source_run_idx
    # Batched inside one JAX process over the global pending queue. Ready
    # trajectories are skipped unless --force is passed.
    batch_size: 9
    optimized_checkpoint_roots:
      - experiments/paper_check/checkpoints/optimization
      - experiments/paper_check/checkpoints_0/optimization
      - experiments/paper_check/checkpoints_reference/optimization
    dedupe_by_run_idx: false
    max_checkpoints: null

  flow_lenia_nnopt_lagrangian_apf:
    enabled: true
    required: false
    # NN-opt/CLIP-OE comparison rollouts use the exact same Flow-Lenia A-run
    # simulation profile as MSPD-opt: 500k steps, 384x384 substrate, sparse APF
    # chunks, and lagrangian tracks. This builder is opt-only by design.
    rollout_config: experiments/paper_suite/flowlenia_arun_apf_500k.yaml
    output_root: experiments/paper_check_flow_lenia/checkpoints/nnopt_lagrangian_apf_500k
    rollout_steps: 500000
    n_trajectories_per_checkpoint: 1
    include_random_baselines: false
    objective_label: clip_oe
    traj_prefix: nnopt
    # Match the MSPD A-run control-A seed convention for comparable initial
    # conditions: seed = run_seed_base + 2 * source_run_idx.
    run_seed_base: 400000
    run_seed_mode: source_run_idx
    batch_size: 9
    optimized_checkpoint_roots:
      - experiments/paper_check_flow_lenia/checkpoints/clip_oe/optimization
    dedupe_by_run_idx: false
    max_checkpoints: null

  plife_plus_c1_lagrangian:
    enabled: true
    required: true
    base_config: experiments/paper_check_plife_plus/frustration_simulation/config.yaml
    output_root: experiments/paper_check_plife_plus/checkpoints/c1_lagrangian_500k
    smoke_output_root: analysis/results/paper_suite_smoke/plife_plus_c1_lagrangian
    rollout_steps: 500000
    total_steps: 500000
    # Keep PLife++ frustration-simulation dynamics/protocol constants; only
    # extend the rollout horizon and saved C6.1 trajectory window.
    late_window_start_steps: 20000
    late_window_end_steps: 500000
    sample_every_steps: 25
    metric_tau_mode: max_grid
    metric_tau_grid_steps: [250, 500, 750, 1000, 1250, 1500, 1750, 2000]
    metric_tau_steps: 500
    metric_window_size_steps: 2500
    metric_window_step_steps: 1250
    include_random_baselines: true
    num_random_baselines: 3
    expected_optimized_groups: 7
    n_trajectories_per_checkpoint: 1
    include_population: false
    include_best_traj: false
    include_final_best: true
    run_seed_base: 400000
    run_seed_mode: source_run_idx
    metric_seed_base: 800000
    selection_mode: loss
    batch_size: 9
    jit_microbatch: 2500
    optimized_checkpoint_roots:
      - experiments/paper_check_plife_plus/checkpoints/optimization_main
    dedupe_by_run_idx: false
    max_checkpoints: null

  commands:
    - name: flow_lenia_paper_check_frustration
      task: paper_check
      enabled: true
      required: true
      heavy: true
      force_policy: reuse_existing
      command: ["{python}", "scripts/run_paper_check_frustration.py", "experiments/paper_check_flow_lenia/config.yaml"]
      expected_paths:
        - experiments/paper_check/checkpoints/frustration_simulation/trial_results.csv
        - experiments/paper_check/checkpoints_0/frustration_simulation/trial_results.csv
        - experiments/paper_check/checkpoints_reference/frustration_simulation/trial_results.csv
      expected_globs:
        - experiments/paper_check/checkpoints/frustration_simulation/trial_data/trial_*_lagrangian.npz
        - experiments/paper_check/checkpoints/frustration_simulation/trial_data/trial_*_embeddings.npz
        - experiments/paper_check/checkpoints_0/frustration_simulation/trial_data/trial_*_lagrangian.npz
        - experiments/paper_check/checkpoints_0/frustration_simulation/trial_data/trial_*_embeddings.npz
        - experiments/paper_check/checkpoints_reference/frustration_simulation/trial_data/trial_*_lagrangian.npz
        - experiments/paper_check/checkpoints_reference/frustration_simulation/trial_data/trial_*_embeddings.npz

    - name: flow_lenia_arun_lagrangian_apf_500k
      task: paper_check_apf
      enabled: true
      required: true
      heavy: true
      # Always enter the idempotent builder when heavy simulation is allowed so
      # a stale manifest cannot hide missing checkpoint roots or APF chunks.
      always_run: true
      command: ["{python}", "scripts/paper_suite_flowlenia_arun_apf.py", "{config}"]
      expected_paths:
        - experiments/paper_check_flow_lenia/checkpoints/arun_lagrangian_apf_500k/manifest.json
      expected_globs:
        - experiments/paper_check_flow_lenia/checkpoints/arun_lagrangian_apf_500k/flow_opt_*/apf_logs/P_steps_*.npz
      expected_npz_keys: [A, P, F, lagrangian_xy, lagrangian_c, resume_batch_rng_key, state_t, state_mass_cycle_start]
      npz_key_check_limit: 3

    - name: flow_lenia_nnopt_lagrangian_apf_500k
      task: nnopt_apf
      enabled: true
      required: false
      heavy: true
      # Idempotent opt-only NN-opt builder. It skips complete trajectories and
      # only simulates missing APF outputs unless --force is passed.
      always_run: true
      command: ["{python}", "scripts/paper_suite_flowlenia_nnopt_apf.py", "{config}"]
      expected_paths:
        - experiments/paper_check_flow_lenia/checkpoints/nnopt_lagrangian_apf_500k/manifest.json
      expected_globs:
        - experiments/paper_check_flow_lenia/checkpoints/nnopt_lagrangian_apf_500k/nnopt_*/apf_logs/P_steps_*.npz
      expected_npz_keys: [A, P, F, lagrangian_xy, lagrangian_c, resume_batch_rng_key, state_t, state_mass_cycle_start]
      npz_key_check_limit: 3

    - name: plife_plus_paper_check_frustration
      task: paper_check
      enabled: true
      required: true
      heavy: true
      force_policy: reuse_existing
      command: ["{python}", "scripts/run_paper_check_frustration.py", "experiments/paper_check_plife_plus/config.yaml"]
      expected_paths:
        - experiments/paper_check_plife_plus/checkpoints/frustration_simulation/trial_results.csv
      expected_globs:
        - experiments/paper_check_plife_plus/checkpoints/frustration_simulation/trial_data/trial_*_lagrangian.npz
        - experiments/paper_check_plife_plus/checkpoints/frustration_simulation/trial_data/trial_*_embeddings.npz

    - name: plife_plus_c1_lagrangian_500k
      task: paper_check_c1
      enabled: true
      required: true
      heavy: true
      always_run: true
      command: ["{python}", "scripts/paper_suite_plife_c1_lagrangian.py", "{config}"]
      expected_paths:
        - experiments/paper_check_plife_plus/checkpoints/c1_lagrangian_500k/manifest.json
        - experiments/paper_check_plife_plus/checkpoints/c1_lagrangian_500k/trial_results.csv
      expected_globs:
        - experiments/paper_check_plife_plus/checkpoints/c1_lagrangian_500k/trial_data/trial_*_lagrangian.npz
      expected_npz_keys: [xy_control_a, sample_offsets_steps, xy_late_sample_steps, trajectory_start_steps, trajectory_end_steps]
      npz_key_check_limit: 3

    - name: boids_paper_check_frustration
      task: paper_check
      enabled: false
      required: false
      heavy: true
      force_policy: reuse_existing
      command: ["{python}", "scripts/run_paper_check_frustration.py", "experiments/paper_check_boids/config.yaml"]
      expected_paths:
        - experiments/paper_check_boids/checkpoints/frustration_simulation/trial_results.csv
      expected_globs:
        - experiments/paper_check_boids/checkpoints/frustration_simulation/trial_data/trial_*_lagrangian.npz
        - experiments/paper_check_boids/checkpoints/frustration_simulation/trial_data/trial_*_embeddings.npz

    - name: flow_lenia_c2_highres_rollouts
      task: c2
      enabled: false
      required: false
      heavy: true
      # Idempotent builder: always run when heavy simulation is allowed so a
      # stale manifest with only a subset of roots cannot mask missing APF logs.
      always_run: true
      command: ["{python}", "scripts/paper_suite_c2_flowlenia_highres.py", "{config}"]
      expected_paths:
        - experiments/paper_check_flow_lenia/checkpoints/c2_highres_rollouts/manifest.json
      expected_globs:
        - experiments/paper_check_flow_lenia/checkpoints/c2_highres_rollouts/flow_opt_*/traj_*/apf_logs/P_steps_*.npz
      expected_npz_keys: [A, P, F, lagrangian_xy, lagrangian_c, resume_batch_rng_key, state_t, state_mass_cycle_start]
      npz_key_check_limit: 3

    - name: flow_lenia_minibang_event_detection_legacy
      task: c2
      enabled: false
      required: false
      heavy: false
      command: ["{python}", "scripts/flowlenia_minibang_detect.py", "experiments/flow_lenia_mspd/checkpoints/minibang_golden_set/run_longrun_check_v2"]
      expected_paths:
        - experiments/flow_lenia_mspd/checkpoints/minibang_golden_set/run_longrun_check_v2/detections/minibang_candidates.csv

smoke:
  meta:
    output_root: analysis/results/paper_suite_smoke
  synthetic:
    seeds: 1
    n_particles: 32
    time_steps: 96
    tau_grid_steps: [1, 2, 4, 8, 12, 16]
    metric_window_size_steps: 24
    metric_window_step_steps: 12
    metric_m_samples: 8
    metric_n_proj: 4
    metric_null_reps: 1
    metric_particle_samples: 32
    metric_delta_h_floor: 0.01
    metric_msc_floor: 0.01
    metric_eps: 1.0e-12
    metric_msc_term: floor_reconstruction_error
    metric_msc_normalize_by_weight_sum: true
    render:
      enabled: true
      size_px: 256
      fps: 12
      max_frames: 96
      trail_steps: 8
      particle_radius_px: 4
    visualization:
      heatmap_max_runs: null
      msc_r_tau_steps: null
  c2:
    branching:
      branch_root: analysis/results/paper_suite_smoke/c2_branching/branches
      max_trajectories: 1
      selection_mode: tau_mean_ranked_high_low
      n_high: 2
      n_mid: 2
      n_low: 2
      selection_seed: 12345
      n_points_per_trajectory: 4
      m_pairs: 2
      branches_per_time: 3
      horizon_steps: 64
