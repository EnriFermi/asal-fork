    enabled: false
    required: false
    frustration_root: experiments/paper_check_boids/checkpoints/frustration_simulation
    analysis_config: experiments/paper_check_boids/frustration_simulation/analysis_config.yaml
    c1:
      metric:
        metric_tau_mode: max_grid
        metric_tau_grid_steps:
