base_config: experiments/paper_check_flow_lenia/optimization/config_longrun_check.yaml

rollout:
  # C2 high-resolution posthoc rollout.
  #
  # This intentionally reuses the paper-check Flow-Lenia optimization config and
  # only changes the substrate size / rollout horizon plus logging needed for
  # Delta-H event selection and resume-capable branching.
  substrate:
    grid_size: 384
    rollout_steps: 500000

  simulation:
    rollout_steps: 500000
    max_steps: 500000
    seed: 0
    img_size: 224
    fps: 250
    video_fps: 30
    codec: libx264
    macro_block_size: 1
    jit_microbatch: 64

  logging:
    snapshot_interval: 1000
    snapshots_per_file: 50
    save_A: true
    save_F: true
    save_rgb: false
    save_fp16: true
    compress: true
    save_lagrangian: true
    save_lagrangian_channels: true
    lagrangian_n_particles: 8192
    lagrangian_init_mode: mass
    lagrangian_flow_channel: -1
    lagrangian_flow_reduce: mass_weighted
    lagrangian_channel_mode: resample
    lagrangian_noise_model: rt_box
    lagrangian_diffusion_scale: 1.0

  metric:
    metric_tau_mode: max_grid
    metric_tau_grid_steps: [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000]
    metric_window_size_steps: 20000
    metric_window_step_steps: 5000
    metric_tau_steps: 3000
    metric_range_start_steps: 150000
    metric_range_end_steps: 500000
    metric_window_size_frames: null
    metric_window_step_frames: null

    metric_m_samples: 48
    metric_m_min: 4
    metric_n_proj: 16
    metric_null_reps: 6
    metric_particle_samples: 64
    metric_dirs_seed: 123
    metric_periodic: false
    metric_domain_y: 384.0
    metric_domain_x: 384.0

    metric_preprocess_mode: clip
    metric_scales: null
    metric_scale_weights: null
    metric_alpha: 0.0
    metric_beta: 1.0
    metric_eps: 1.0e-12

minibang:
  # Section name is kept because scripts/flowlenia_minibang_simulate.py expects
  # it. This is not the old minibang golden set; the wrapper passes one
  # optimized checkpoint directory at a time.
  checkpoint_dir: null
  output_root: null
  n_trajectories: 1
  batch_size: 1

  selection_mode: loss
  include_population: false
  include_best_traj: false
  include_final_best: true

  # Keep the high-res rollout layer simulation-only. The paper-suite metrics
  # layer recomputes metrics.npz from the saved APF chunks without resimulation.
  compute_metrics: false
  compute_delta_h: true
  compute_clusters: true
  metrics_strict: true
  metrics_seed: 12345
  detect_start_step: 150000
  detect_max_duration_steps: 30000
  detect_delta_h_derivative_lag_steps: 30000

  minibang_metric_tau_mode: max_grid

  cluster_method: dpmeans
  cluster_space: pcolor_chroma
  cluster_dp_lambda: 0.18
  cluster_dp_iters: 8
  cluster_dp_max_clusters: 32
  cluster_merge_color_families: true
  cluster_merge_rgb_threshold: 0.0
  cluster_merge_hue_threshold_deg: 0.0
  cluster_merge_min_saturation: 0.2
  cluster_merge_min_value: 0.05
  cluster_max_samples: 200000
  cluster_samples_per_snapshot: null
  cluster_min_mass: 1.0e-8
  cluster_standardize: false
  cluster_change_lag_steps: 5000

  cluster_k: 8
  cluster_kmeans_iters: 40
  cluster_kmeans_restarts: 2
