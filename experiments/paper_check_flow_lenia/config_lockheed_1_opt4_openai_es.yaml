meta:
  machine_idx: ${env:PAPER_MACHINE_IDX,0}
  num_machines: ${env:PAPER_NUM_MACHINES,1}
  wandb_project: asal
  wandb_mode: online
  output_root: experiments/paper_check_flow_lenia/checkpoints_lockheed_1_opt4_openai_es

paper_check:
  # Exact lockheed_1 optimization run index: seed = 1003 + 4 = 1007,
  # output directory = optimization/run_004.
  run_indices: [4]
  num_optimizations: 9
  num_random_baselines: 3
  optimization_seed_base: 1003
  random_param_seed_base: 200003
  pair_seed_base: 400003
  metric_seed_base: 800003

optimization:
  base_config: optimization/config_longrun_check_fix.yaml
  save_root: ${meta.output_root}/optimization
  resume: true
  save_every: 1
  overrides:
    optimization:
      # Mirrored Batch OpenAI-ES on the same lockheed_1 opt_004 base setup.
      optimizer_algorithm: mirrored_openai_es
      selection_protocol: mean_loss
      openai_es_n_pairs: 4
      openai_es_n_seeds: 8
      openai_es_sigma: 0.2
      openai_es_lr: 0.03
      openai_es_adam_beta1: 0.9
      openai_es_adam_beta2: 0.999
      openai_es_adam_eps: 1.0e-8

frustration_simulation:
  base_config: frustration_simulation/config.yaml
  save_root: ${meta.output_root}/frustration_simulation
  resume: true
  trial_batch_size: 4
  checkpoint_every_steps: 5000
  full_embedding_sample_every_steps: 1000
  log_full_embeddings_for_b: false
  overrides: {}
