meta:
  seed: 0
  save_dir: experiments/paper_check_plenia/checkpoints/frustration_simulation

source:
  checkpoint_dir: experiments/paper_check_plenia/checkpoints/optimization/run_000
  params_name: best
  params_path: null

substrate:
  substrate: plenia
  rollout_steps: 200000
  n_particles: 200
  dt: 0.1

protocol:
  warmup_steps: 100000
  total_steps: 200000
  grid_split: 2
  perturbation_kind: cell_shuffle
  perturbation_grid_split: 2
  perturbation_strength: 1.0
  perturbation_jitter: 0.0
  perturbation_domain_padding: 0.05

evaluation:
  enable_clip: true
  enable_msc: true
  n_initial_states: 5
  foundation_model: clip
  clip_img_size: 224
  time_sampling: 8
  late_window_start_steps: 150000
  late_window_end_steps: 200000
  late_window_size_steps: null
  distance_metric: cosine_mean
  resume: true
  save_embeddings: true
  save_lagrangian_tracks: true

metric:
  sample_every_steps: 1000
  metric_trajectory_source: state_x
  metric_unwrap_state_x: false
  metric_window_size_steps: 20000
  metric_window_step_steps: 5000
  metric_tau_steps: 3000
  metric_range_start_steps: 0
  metric_range_end_steps: null
  metric_window_size_frames: null
  metric_window_step_frames: null
  metric_tau_frames: null
  metric_tau_mode: fixed
  metric_tau_grid_steps: null
  metric_tau_grid_frames: null
  metric_m_samples: 48
  metric_m_min: 4
  metric_n_proj: 16
  metric_null_reps: 6
  metric_particle_samples: 64
  metric_dirs_seed: 123
  metric_periodic: false
  metric_domain_y: null
  metric_domain_x: null
  metric_preprocess_mode: clip
  metric_scales: null
  metric_scale_weights: null
  metric_alpha: 0.0
  metric_beta: 1.0
  metric_eps: 1.0e-12

logging:
  wandb_project: asal
  wandb_mode: online
