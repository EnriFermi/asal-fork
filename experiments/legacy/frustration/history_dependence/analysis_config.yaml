source:
  type: history_dependence_eval
  path: experiments/legacy/frustration/checkpoints/history_dependence_opt1_best

output:
  dir: experiments/legacy/frustration/checkpoints/history_dependence_opt1_best/offline_analysis

embeddings:
  enabled: true
  normalize: true
  synced_metrics:
    - cosine
    - euclidean
  cloud_metrics:
    - cosine
  cloud_method: chamfer
  primary_metric: embedding_cloud_chamfer_cosine

trajectories:
  enabled: true
  metric_tau_mode: max_grid
  metric_tau_grid_steps:
    - 1000
    - 3000
    - 5000
    - 7000
    - 9000
  metric_window_size_steps: 20000
  metric_window_step_steps: 5000
  metric_m_samples: 48
  metric_m_min: 4
  metric_n_proj: 16
  metric_null_reps: 6
  metric_particle_samples: 64
  metric_dirs_seed: 123
  metric_preprocess_mode: clip
  metric_alpha: 0.0
  metric_beta: 1.0
  occupancy_bins: 64
  pairwise_map_metrics:
    - l2
    - mean_abs
  fixed_tau_distribution_steps: 3000
  pairwise_distribution_metrics:
    - wasserstein
    - ks
    - energy
  primary_map_metric: delta_h_l2

statistics:
  permutation_max_exact: 200000
  permutation_samples: 20000
  permutation_seed: 0

main_observable:
  enabled: true
  distance_name: embedding_cloud_chamfer_cosine
  class_a: free-wall
  class_b: free-free
  tie_tolerance: 0.0
  bootstrap_reps: 2000
  bootstrap_seed: 0
  ci_level: 0.95
  permutation_max_exact: 200000
  permutation_samples: 20000
  permutation_seed: 0
  strip_center: mean
  include_matrix_figure: true
  figure_dpi: 180
  trial_effect_mode: mean_controls
  trial_anchor_variant: control_a

trial_level_tests:
  enabled: true
  metrics:
    - delta_h_dist_tau3000_ks
    - delta_h_dist_tau3000_energy
    - absdiff_mean_speed
    - absdiff_speed_std
    - absdiff_spatial_spread
  effect_mode: anchor
  anchor_variant: control_a
  bootstrap_reps: 2000
  bootstrap_seed: 0
  ci_level: 0.95
  permutation_max_exact: 200000
  permutation_samples: 20000
  permutation_seed: 0
  zero_tolerance: 1.0e-12
  figure_dpi: 180

progress:
  enabled: true
  show_inner: true

reporting:
  representative_runs_per_condition: 2
  primary_embedding_metric: embedding_cloud_chamfer_cosine
  primary_delta_h_metric: delta_h_l2
  primary_scalar_metric: absdiff_msc_scalar
  figure_dpi: 180
