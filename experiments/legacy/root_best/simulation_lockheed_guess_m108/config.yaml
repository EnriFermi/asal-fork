meta:
  save_dir: data/lockheed_1

substrate:
  sobel_impl: scipy
  mass_renorm: true
  substrate: lenia_flow
  rollout_steps: 500
  grid_size: 512
  C: 3
  k: 27
  kernel_components: 15
  M: "3,3,3;3,3,3;3,3,3"
  dd: 5
  dt: 0.2
  sigma: 0.65
  border: wall
  mix_rule: stoch_gene_wise
  base_seed: 0
  seed_patch_size: 20
  seed_n_patches: 24
  seed_mode: random_patches
  p_constant_per_patch: 1
  render_mode: Pcolor
  clip1: .inf
  clip2: .inf
  mutations: true
  mutation_sz: 40
  mutation_p: 0.2
  mutation_scale: 1.0
  optimize_mutation_scale: false
  volcano: false
  volcano_sz: 30
  volcano_p: 0.01
  volcano_delta: 5.0
  food: false
  food_interval: 128
  food_n: 3
  food_sz: 16
  food_amount: 1.0
  food_consume_rate: 0.05
  food_bonus: 1.0
  mass_decay: 0.0
  food_channel: 1
  food_auto_size: false
  food_auto_scale: 1.0
  food_conv_mode: scalar
  food_vis_scale: 1.0
  food_vis_color: "0.6,0.3,0.0"
  food_diffusion_alpha: 0.0
  mass_clip_eps: 0.0

simulation:
  time_sampling: video
  img_size: 300
  seed: 618
  n_seeds: 24
  seed_mode: random_patches
  p_constant_per_patch: 1
  render_mode: Pcolor
  output: experiments/legacy/root_best/simulation_lockheed_guess_m108/root_best__lockheed_guess_m108.mp4
  fps: 250
  codec: libx264
  macro_block_size: null
  batch_steps: 256
  jit_microbatch: 64
  max_steps: 10000000
  mass_plot: experiments/root_best/simulation_lockheed_guess_m108/root_best__lockheed_guess_m108__mass.png
  log_mass_every: 1024
  traj_iter: null
  compute_oe: false
  oe_every: 100
  oe_plot: experiments/legacy/root_best/simulation_lockheed_guess_m108/root_best__lockheed_guess_m108__oe.png

logging:
  wandb_project: asal
