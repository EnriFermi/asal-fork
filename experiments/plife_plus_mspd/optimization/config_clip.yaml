meta:
  seed: 1
  save_dir: experiments/plife_plus_mspd/checkpoints/clip_oe_sakana_defaults
  resume: false

substrate:
  substrate: plife_plus
  rollout_steps: 1000
  n_particles: 1000
  n_colors: 6
  n_dims: 2
  x_dist_bins: 7
  beta: 0.3
  alpha: 0.0
  mass: 0.1
  dt: 0.02
  half_life: 0.04
  rmax: 0.1
  render_radius: 0.04
  sharpness: 30.0
  update_colors: true
  world_size: 1.0
  border: torus
  neighbor_mode: dense
  background_color: black

evaluation:
  foundation_model: clip
  time_sampling: 32
  prompts: "a biological cell"
  coef_prompt: 0.0
  coef_softmax: 0.0
  coef_oe: 1.0
  coef_smooth: 0.0

optimization:
  optimizer: Sep-CMA-ES
  params_init: substrate_default
  bs: 1
  pop_size: 8
  n_iters: 10
  sigma: 0.2
  eval_splits: 8

logging:
  wandb_project: asal
  wandb_mode: online
  save_every: 1
  pca_every: 0
  pca_history: 100
  full_video_interval: 0
  full_video_rollout_steps: 1000
  full_video_img_size: 140
