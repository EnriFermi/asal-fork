meta:
  seed: 0
  save_dir: experiments/frustration/checkpoints/history_dependence_opt1_best

source:
  checkpoint_dir: experiments/opt_msc/checkpoints/test_run_longer_opt
  params_name: best
  params_path: null

substrate:
  substrate: lenia_flow
  grid_size: 384
  rollout_steps: 1000000
  C: 3
  k: 9
  kernel_components: 3
  M: "2,1,0;0,2,1;1,0,2"
  dd: 5
  dt: 0.2
  sigma: 0.65
  border: wall
  mix_rule: stoch
  base_seed: 0
  seed_patch_size: 20
  seed_n_patches: 16
  seed_mode: random_patches
  p_constant_per_patch: 1
  render_mode: Pcolor
  clip1: .inf
  clip2: .inf
  mutations: true
  mutation_sz: 40
  mutation_p: 0.05
  mutation_scale: 1.0
  optimize_mutation_scale: false
  volcano: false
  volcano_sz: 30
  volcano_p: 0.01
  volcano_delta: 5.0
  food: false
  food_interval: 128
  food_n: 3
  food_sz: 16
  food_amount: 1.0
  food_consume_rate: 0.05
  food_bonus: 1.0
  mass_decay: 0.0
  food_channel: 1
  food_auto_size: false
  food_auto_scale: 1.0
  food_conv_mode: scalar
  food_vis_scale: 1.0
  food_vis_color: "0.6,0.3,0.0"
  food_diffusion_alpha: 0.0
  mass_clip_eps: 0.0

protocol:
  grid_split: 2
  warmup_steps: 500000
  total_steps: 1000000
  wall_pad: 5

evaluation:
  n_initial_states: 16
  foundation_model: clip
  clip_img_size: 224
  time_sampling: 8
  late_window_start_steps: 800000
  late_window_end_steps: 1000000
  late_window_size_steps: null
  distance_metric: cosine_mean
  resume: true
  save_embeddings: true

logging:
  wandb_project: asal
  wandb_mode: online
